# Default: zero-setup local demo database. Data remains while the app is running.
spring.application.name=SIH26006 Freight Intelligence
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:freightdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=3
server.port=${PORT:8080}
server.error.include-message=never
