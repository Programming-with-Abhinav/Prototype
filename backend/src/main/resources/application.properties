# Application Name
spring.application.name=SIH26006 Freight Intelligence

# Database configuration:
# Default safe local development option: H2 in MySQL mode for canonical sih26006_freight_intelligence database.
# Overridable via DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, and DATABASE_DRIVER environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:sih26006_freight_intelligence;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=3

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=never

