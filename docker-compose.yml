services:
  mysql:
    image: mysql:8.4
    container_name: sih26006-mysql
    environment:
      MYSQL_DATABASE: sih26006
      MYSQL_USER: freight_user
      MYSQL_PASSWORD: freight_dev_password
      MYSQL_ROOT_PASSWORD: change_this_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pchange_this_root_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
